[lints]
workspace = true

[package]
name = "vsr-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Framework-neutral runtime traits for VSR services: HTTP, auth, authz, storage, audit"
license.workspace = true
repository.workspace = true

# vsr-runtime defines the contracts that all runtime implementations must satisfy.
# Default features are intentionally empty — consumers opt in to the implementations
# they need. This keeps the trait layer compilable without any heavy dependencies.
[dependencies]
vsr-core.workspace = true
bytes = "1"
serde.workspace = true
serde_json.workspace = true
# Protocol types and routing are shared; no framework types escape the API.
http = "1"
matchit = "0.8"
form_urlencoded = "1"
percent-encoding = "2"
unicode-segmentation = "1"
base64 = "0.22"
dotenvy = { workspace = true, optional = true }
dunce = { version = "1", optional = true }
futures-util = { version = "0.3", optional = true }
log = { workspace = true, optional = true }
anyhow = { version = "1.0", optional = true }
rust_decimal = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
garde = { workspace = true, optional = true }

[features]
default = []

# Native field parsing and validation without a compiler or HTTP dependency.
native-validation = ["dep:anyhow", "dep:chrono", "dep:rust_decimal", "dep:uuid", "dep:garde"]

# ── HTTP implementations ──────────────────────────────────────────────────────
# Enable the actix-web adapter (default runtime implementation).
http-actix = ["actix-security", "dep:tokio", "tls"]
# Alternative transport for the same VSR handlers and route table.
http-axum = ["dep:axum", "dep:axum-server", "dep:tower-http", "dep:http-body-util", "dep:tokio", "tls"]

# Actix security middleware shared by native and emitted servers.
actix-security = ["dep:actix-web", "dep:actix-cors", "dep:dotenvy", "dep:futures-util", "dep:log"]

# Legacy static-file adapter hosted in the runtime until Axum parity lands.
static-actix = ["dep:actix-web", "dep:actix-files"]

# Certificate/key loading shared with the legacy facade and both transports.
tls = ["dep:rustls"]

# ── Auth capabilities ──────────────────────────────────────────────────────────
# Email / OTP flows (pulls lettre).
auth-email = ["dep:lettre"]
# Built-in access-token/account-state policy and bounded password workers.
auth-builtin = ["dep:cookie", "dep:bcrypt", "dep:sha2", "dep:hex", "dep:tokio", "dep:chrono", "dep:getrandom", "dep:url"]

# ── Storage ────────────────────────────────────────────────────────────────────
storage-local = ["dep:dunce"]
storage-s3 = ["dep:object_store"]

# ── Rate limiting ──────────────────────────────────────────────────────────────
rate-limit-redis = []  # placeholder; implementation added when needed

# ── Observability ──────────────────────────────────────────────────────────────
tracing = ["dep:tracing", "vsr-core/tracing"]

# ── Database back-ends (re-exported from vsr-core) ────────────────────────────
sqlite     = ["vsr-core/sqlite"]
postgres   = ["vsr-core/postgres"]
mysql      = ["vsr-core/mysql"]
turso-local = ["vsr-core/turso-local"]

[dependencies.tokio]
version = "1"
features = ["rt", "time", "sync", "net"]
optional = true

[dependencies.actix-web]
version = "4"
features = ["rustls-0_23"]
optional = true

[dependencies.actix-cors]
workspace = true
optional = true

[dependencies.actix-files]
workspace = true
optional = true

[dependencies.rustls]
workspace = true
optional = true

[dependencies.axum]
version = "0.8"
optional = true

[dependencies.axum-server]
version = "0.8"
default-features = false
features = ["tls-rustls-no-provider"]
optional = true

[dependencies.http-body-util]
version = "0.1"
optional = true

[dependencies.tower-http]
version = "0.7"
default-features = false
features = ["cors", "compression-br", "compression-gzip", "compression-deflate", "decompression-br", "decompression-gzip", "decompression-deflate"]
optional = true

[dependencies.lettre]
version = "0.11"
default-features = false
features = ["builder", "smtp-transport", "tokio1", "tokio1-native-tls"]
optional = true

[dependencies.object_store]
version = "0.14.1"
default-features = false
optional = true

[dependencies.tracing]
version = "0.1"
optional = true

[dependencies.cookie]
version = "0.16.2"
features = ["percent-encode"]
optional = true

[dependencies.bcrypt]
workspace = true
optional = true

[dependencies.sha2]
workspace = true
optional = true

[dependencies.hex]
workspace = true
optional = true

[dependencies.chrono]
workspace = true
optional = true

[dependencies.getrandom]
version = "0.4"
optional = true

[dependencies.url]
version = "2"
optional = true

[dev-dependencies]
tempfile = "3"
flate2 = "1"
rcgen.workspace = true
reqwest.workspace = true
tokio = { version = "1", features = ["rt", "macros", "signal"] }
