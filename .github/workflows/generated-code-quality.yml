name: Generated Code Quality

on:
  pull_request:
  push:
    branches:
      - main
      - v1
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  builtin-auth-migration:
    name: Built-in Auth Migration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test Framework-Neutral Authentication
        run: cargo test -p vsr-runtime --no-default-features --features auth-builtin --lib --locked
      - name: Test Account Password Concurrency And Schema Compatibility
        run: cargo test -p rest_macro_core --no-default-features --features sqlite --lib auth::accounts::tests --locked
      - name: Test Recovery Transactions And Cancellation
        run: cargo test -p rest_macro_core --no-default-features --features sqlite --lib auth::tokens::tests --locked
      - name: Test Local Turso Recovery Transactions
        if: runner.os == 'Linux'
        run: cargo test -p rest_macro_core --no-default-features --features sqlite,turso-local --lib auth::tokens::tests --locked
      - name: Compare Native Actix And Both Transports With Built-in Accounts
        run: cargo test -p rest_macro_core --no-default-features --features sqlite --test builtin_auth_runtime --locked
      - name: Keep Frameworks Out Of Authentication Policy
        shell: bash
        run: |
          cargo tree -p vsr-runtime --no-default-features --features auth-builtin -e normal --prefix none --locked > auth-dependencies.txt
          if grep -E '^(actix[-_ ]|axum[- ])' auth-dependencies.txt; then
            exit 1
          fi

  enterprise-authorization:
    name: Enterprise Authorization (${{ matrix.transport }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        transport: [axum, actix, 'axum,actix']
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prove EON Authorization Over Real HTTP
        run: cargo test -p enterprise-api --no-default-features --features ${{ matrix.transport }} --locked
      - name: Verify Axum Runtime Isolation
        if: matrix.transport == 'axum'
        shell: bash
        run: |
          cargo tree -p enterprise-api --no-default-features --features axum -e normal --prefix none --locked > enterprise-dependencies.txt
          if grep -E '^actix[-_ ]' enterprise-dependencies.txt; then
            exit 1
          fi

  http-backend-contract:
    name: HTTP Contract (${{ matrix.os }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        backend: [http-actix, http-axum, 'http-actix,http-axum']
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check Neutral Contracts
        run: cargo check -p vsr-runtime --no-default-features --locked
      - name: Verify Backend Contract
        run: cargo test -p vsr-runtime --no-default-features --features ${{ matrix.backend }} --test http_conformance --locked
      - name: Compile Embedding Example
        run: cargo check -p vsr-runtime --no-default-features --features ${{ matrix.backend }} --example http_backend --locked
      - name: Keep Actix Out Of Axum Consumers
        if: matrix.backend == 'http-axum'
        shell: bash
        run: |
          cargo tree -p vsr-runtime --no-default-features --features http-axum -e normal --prefix none --locked > http-dependencies.txt
          if grep -E '^actix[-_ ]' http-dependencies.txt; then
            echo "Axum-only consumers must not depend on Actix"
            exit 1
          fi

  database-concurrency:
    name: Database Concurrency (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: postgres
            url: postgres://vsr:vsr-test@127.0.0.1:5432/vsr_test
          - backend: mysql
            url: mysql://vsr:vsr-test@127.0.0.1:3306/vsr_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vsr
          POSTGRES_PASSWORD: vsr-test
          POSTGRES_DB: vsr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vsr -d vsr_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: vsr-root-test
          MYSQL_USER: vsr
          MYSQL_PASSWORD: vsr-test
          MYSQL_DATABASE: vsr_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pvsr-root-test"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      VSR_TEST_DATABASE_URL: ${{ matrix.url }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify Migration Serialization And Recovery
        run: cargo test -p vsra --all-features server_database_migration_integrity_and_concurrency -- --ignored --nocapture
      - name: Verify Concurrent Reset-Token Consumption
        run: cargo test -p rest_macro_core --all-features server_database_auth_tokens_are_consumed_once -- --ignored --nocapture

  rust-feature-check:
    name: Rust Check (${{ matrix.os }}, ${{ matrix.feature_profile }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        feature_profile:
          - default
          - no-default-features
          - all-features

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check Workspace
        if: matrix.feature_profile == 'default'
        run: cargo check --workspace

      - name: Check Workspace Without Default Features
        if: matrix.feature_profile == 'no-default-features'
        run: cargo check --workspace --no-default-features

      - name: Check Workspace With All Features
        if: matrix.feature_profile == 'all-features'
        run: cargo check --workspace --all-features

  generated-warning-clean:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/cms/web/package-lock.json

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Root npm Workspace
        run: npm ci

      - name: Install TypeScript Tooling For Generated Client Checks
        run: npm ci --prefix examples/cms/web

      - name: Verify CMS Build And Lint
        working-directory: examples/cms/web
        run: |
          npm run lint
          npm run build

      - name: Verify CMS Browser Compatibility
        working-directory: examples/cms/web
        run: |
          npx playwright install --with-deps chromium
          node scripts/smoke.mjs

      - name: Verify Rust-To-TypeScript Schema Bindings
        run: npm run check:vsr-schema

      - name: Verify npm Package Wrapper And Types
        run: npm run check:vsr-package

      - name: Check Compiler Crate
        run: cargo check -p rest_macro_core

      - name: Enforce Workspace Lint Policy
        run: cargo clippy --workspace --all-features --all-targets

      - name: Verify Expanded Output Snapshots
        run: cargo test -p vsra expand_server_code_ -- --nocapture

      - name: Verify Schema Check Snapshots And Rules
        run: |
          cargo test -p vsra commands::check::tests:: -- --nocapture
          cargo test -p vsra check_command_accepts_strict_and_json_format -- --nocapture

      - name: Verify Representative OpenAPI Parity Surfaces
        run: |
          cargo test -p rest_macro_core --features codegen compiler::openapi::tests::renders_openapi_with_authorization_management_routes_when_enabled -- --nocapture
          cargo test -p rest_macro_core --features codegen compiler::openapi::tests::renders_openapi_builtin_auth_admin_routes_match_runtime_surface -- --nocapture
          cargo test -p rest_macro_core --features codegen compiler::openapi::tests::renders_openapi_builtin_auth_email_routes_match_runtime_surface -- --nocapture
          cargo test -p rest_macro_core --features codegen compiler::openapi::tests::renders_openapi_builtin_auth_jwks_route_for_asymmetric_jwt -- --nocapture
          cargo test -p rest_macro_core --features codegen compiler::openapi::tests::renders_openapi_storage_upload_paths -- --nocapture
          cargo test -p rest_macro_core --features codegen compiler::openapi::tests::renders_openapi_resource_action_paths -- --nocapture
          cargo test -p rest_macro_core --features codegen compiler::openapi::tests::renders_openapi_api_aliases_for_paths_properties_and_query_parameters -- --nocapture
          cargo test -p rest_macro_core --features codegen compiler::openapi::tests::renders_openapi_resource_api_field_projections -- --nocapture
          cargo test -p rest_macro_core --features codegen compiler::openapi::tests::renders_openapi_field_transform_resource_surface -- --nocapture
          cargo test -p rest_macro_core --features codegen compiler::openapi::tests::renders_openapi_mixin_expanded_resource_surface -- --nocapture

      - name: Verify Representative Spawned-Server Runtime Parity
        run: |
          cargo test -p vsra --test serve_cli vsr_serve_supports_builtin_auth_portal_dashboard_and_admin_users -- --nocapture
          cargo test -p vsra --test serve_cli vsr_serve_exposes_jwks_for_asymmetric_jwt -- --nocapture
          cargo test -p vsra --test serve_cli vsr_serve_supports_storage_uploads_and_public_mounts -- --nocapture
          cargo test -p vsra --test serve_cli vsr_serve_applies_resource_actions_in_spawned_process -- --nocapture
          cargo test -p vsra --test serve_cli vsr_serve_supports_api_name_aliases_in_spawned_process -- --nocapture
          cargo test -p vsra --test serve_cli vsr_serve_applies_api_projections_in_spawned_process -- --nocapture
          cargo test -p vsra --test serve_cli vsr_serve_applies_field_transforms_in_spawned_process -- --nocapture
          cargo test -p vsra --test serve_cli vsr_serve_expands_mixin_fields_in_spawned_process -- --nocapture

      - name: Verify Representative Examples Pass Strict Schema Checks
        run: |
          cargo run -p vsra -- check --input examples/template/api.eon --strict
          cargo run -p vsra -- check --input examples/cms/api.eon --strict
          cargo run -p vsra -- check --input examples/family_app/family_app.eon --strict

      - name: Verify Docs Reference, Starter Template, And Book
        run: |
          cargo test -p vsra render_eon_reference_mentions_core_sections -- --nocapture
          cargo test -p vsra checked_in_reference_matches_generator -- --nocapture
          cargo test -p vsra create_project_writes_local_comment_config_starter -- --nocapture
          cargo install mdbook --locked --version 0.5.2
          mdbook build docs

      - name: Verify Generated Client Report Snapshot
        run: cargo test -p vsra --test client_cli client_ts_self_test_static_report_matches_snapshot -- --nocapture

      - name: Verify Generated Client Integration Tests
        run: cargo test -p vsra --test client_cli -- --nocapture

      - name: Verify Example Generated Clients Pass Static Self-Tests
        run: ./scripts/client_self_test_examples.sh --mode static

      - name: Verify Example Generated Clients Pass Live Self-Tests
        run: ./scripts/client_self_test_examples.sh --mode live

      - name: Verify Generated Projects Are Warning Clean
        run: cargo test -p vsra warning_clean -- --ignored --nocapture --test-threads=1

      - name: Verify Representative Generated Projects Are Clippy Clean
        run: cargo test -p vsra clippy_clean -- --ignored --nocapture --test-threads=1
